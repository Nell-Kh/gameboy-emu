name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-24.04
            cxx: g++
          - name: linux-clang
            os: ubuntu-24.04
            cxx: clang++
          - name: macos-clang
            os: macos-latest
            cxx: clang++
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure (ASan + UBSan)
        run: cmake --preset asan

      - name: Build
        run: cmake --build --preset asan

      - name: Test
        run: ctest --preset asan

  lint:
    name: clang-format + clang-tidy
    runs-on: ubuntu-24.04
    env:
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18 clang-format-18 clang-tidy-18

      - name: clang-format check
        run: git ls-files '*.h' '*.cpp' | xargs clang-format-18 --dry-run --Werror

      - name: Configure (writes compile_commands.json, fetches GoogleTest)
        run: cmake --preset debug

      - name: clang-tidy
        run: git ls-files '*.cpp' | xargs -P 4 -n 1 clang-tidy-18 -p build/debug --quiet